name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  regression-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run golden dataset eval
        id: eval
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 | tee eval_output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Comment results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('eval_output.txt', 'utf8');
            const passed = !output.includes('FAILED');
            const body = [
              passed ? '### ✅ Eval suite passed, no regressions' : '### ❌ Eval suite found a regression',
              '',
              '<details><summary>Full output</summary>',
              '',
              '```',
              output.slice(-4000),
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # Only fires when the run actually failed, not on every push.
      # Set SLACK_WEBHOOK_URL as a repo secret to enable.
      - name: Notify Slack on regression
        if: failure()
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\": \"⚠️ Eval regression detected in ${{ github.repository }} on ${{ github.ref_name }}. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL not set, skipping Slack notification."
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
