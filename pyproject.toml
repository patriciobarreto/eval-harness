[project]
name = "eval-harness"
version = "0.1.0"
description = "Golden-dataset regression testing for LLM-powered agents. Runs your agent against known-good examples on every change and flags regressions before they ship."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
